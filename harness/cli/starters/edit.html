<!doctype html>
<html data-aspect="{{aspect}}">
<head>
<meta charset="utf-8">
<meta name="duration" content="{{length}}">
<meta name="aspect" content="{{aspect}}">
<meta name="message" content="one thing to remember">
<meta name="spectacle" content="{{spectacle}}">
<meta name="signature" content="{{signature}}">
<title>{{title}}</title>
<!-- an edit: s1 is the title card, every other world holds one clip from films/<name>/footage/ (the person's own, moved whole: trim, order, speed).
  Each world's data-cut is hard or fade: change it per cut, with the reason in brief.md "Cut list". The clip's data-at is its world's start; trim, trim-end and rate are literals the studio edits.
  Replace the grey with the palette, the stand-in face with the film's, and the caption words with what the clip shows. -->
<style>
  @font-face { font-family: "{{family}}"; src: url("assets/{{font}}") format("woff2"); font-weight: 100 900; }
  :root { --ground: {{ground}} /* unchosen: palette dial */; --ink: {{ink}} /* unchosen: palette dial */; {{beats}} }
  :root { --band: calc(var(--vh) * 0.2); }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  .world { position: absolute; inset: 0; isolation: isolate; box-sizing: border-box; font-family: "{{family}}", sans-serif; }
{{groundCss}}
  .title { position: absolute; inset: 0; display: grid; align-content: end; gap: calc(var(--vh) * 0.03); padding: 0 calc(var(--vw) * 0.07) calc(var(--vh) * 0.12); }
  h1 { margin: 0; font-size: calc(var(--vh) * 0.14); font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .line { margin: 0; font-size: calc(var(--vh) * 0.09); letter-spacing: -0.03em; }
  [data-aspect="9:16"] h1 { font-size: calc(var(--vw) * 0.13); }
  video { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--band)); object-fit: contain; }
  .lower { position: absolute; left: calc(var(--vw) * 0.07); right: calc(var(--vw) * 0.07); bottom: calc(var(--vh) * 0.055); height: calc(var(--band) - var(--vh) * 0.055); margin: 0; display: flex; align-items: center;
           font-size: calc(var(--vh) * 0.065); font-weight: 600; letter-spacing: -0.02em; }
</style>
<script type="module">
import { enter, leave, EASE } from '../../core/motion/presets.js';
await document.fonts.load('700 1em "{{family}}"');
const root = document.documentElement;
const end = window.vawe?.duration ?? parseFloat(document.querySelector('meta[name="duration"]').content);
const beat = (n) => {
  const start = parseFloat(getComputedStyle(root).getPropertyValue('--beat-' + n));
  return Number.isNaN(start) ? end : start;
};
const $ = (s) => document.querySelector(s);
const worlds = [...document.querySelectorAll('[data-world]')];
const FADE = 0.4;
const show = (el, visibility, at, fill) => el.animate([{ visibility: visibility === 'visible' ? 'hidden' : 'visible' }, { visibility }], { delay: at * 1000, duration: 1, fill });
const DRIFT = [[-0.2, 0.1], [0.18, -0.2], [0.14, -0.16]];
const drift = (world, from, to) => world.querySelectorAll('.ground i').forEach((blob, k) => blob.animate([{ translate: '0 0' }, { translate: 'calc(var(--vw) * ' + DRIFT[k][0] + ') calc(var(--vh) * ' + DRIFT[k][1] + ')' }], { delay: from * 1000, duration: (to - from) * 1000, easing: EASE.glide, fill: 'both' }));
worlds.forEach((world, i) => {
  const from = beat(i + 1), stop = i + 1 === worlds.length ? end : beat(i + 2);
  const fade = world.dataset.cut === 'fade';
  if (i) show(world, 'visible', fade ? from - FADE : from, 'both');
  if (fade) world.animate([{ opacity: 0 }, { opacity: 1 }], { delay: (from - FADE) * 1000, duration: FADE * 1000, easing: 'linear', fill: 'both' });
  if (i + 1 < worlds.length) show(world, 'hidden', stop, 'forwards');
  drift(world, from, stop);
});
const card = $('.title');
enter(card.querySelector('h1'), { at: 0.1, blur: 12, from: '0 0.4em' });
enter(card.querySelector('.line'), { at: 0.3, blur: 8, from: '0 0.4em' });
leave(card.querySelector('.line'), { end: beat(2) - 0.06 });
leave(card.querySelector('h1'), { end: beat(2) });
worlds.forEach((world, i) => {
  const lower = world.querySelector('.lower');
  if (!lower) return;
  enter(lower, { at: beat(i + 1) + 0.4, from: '-0.6em 0' });
  leave(lower, { end: beat(i + 2) - 0.06 });
});
</script>
</head>
<body>
{{worlds}}
</body>
</html>
