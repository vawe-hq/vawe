name: framework gates

# Basic checks that pass on a clean checkout. The pre-push hook (.githooks/pre-push) is the main gate:
# it runs the site build, the dev tests and the e2e renders locally. Run the e2e here by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: run the e2e renders of every page film
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basics:
    name: basics (static gates, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAWE_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json', '.puppeteerrc.cjs') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: static gates
        run: |
          for g in no-emdash rule-length skill-reach; do
            node bin/vawe-dev check "$g"
          done
      - run: node quality/gates/doc-refs.mjs
      - name: fetch the locked faces
        run: node generators/media/fonts.mjs
      - run: node --test --test-concurrency=1 'tests/lib/*.test.mjs' 'tests/motion/*.test.mjs' 'tests/hooks/*.test.mjs'

  e2e:
    name: "e2e (manual: page tests and draft renders of every page film)"
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json', '.puppeteerrc.cjs') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: fetch the locked faces
        run: node generators/media/fonts.mjs
      - run: node bin/vawe-dev e2e
      - name: upload e2e report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: quality/runs/e2e
          retention-days: 14
          if-no-files-found: warn
