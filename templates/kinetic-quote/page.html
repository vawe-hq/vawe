<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="8">
<meta name="aspect" content="16:9">
<meta name="message" content="say less, mean it, make it move">
<meta name="spectacle" content="4.6">
<meta name="signature" content="band=energy; ease=land; stagger=70; seam=cut; palette=mono plus accent; thread=type">
<title>Say less</title>
<!-- a kinetic quote: one word at a time, each with its own way in (typed, decoded, slammed, tilted), then the last word fills the frame.
  Replace the words and the credit; keep the beats. The finale reads the word in .giant and sets one letter per glyph. -->
<style>
  @font-face { font-family: "Archivo"; src: url("assets/Archivo.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --beat-1: 0s;      /* typed word */
    --beat-2: 1.3s;    /* decoded word */
    --beat-3: 2.6s;    /* dark ground, two words slam */
    --beat-4: 3.7s;    /* light again, two words tilt in */
    --beat-5: 4.6s;    /* the last word fills the frame */
    --beat-6: 6.4s;    /* the credit is typed */
    --paper: #f2eff3;
    --paper-lit: #ffffff;
    --ink: #151317;
    --dark: #0b0a0c;
    --dark-lit: #25212a;
    --accent: #ff3d2e;
  }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: clip; }
  .world { position: absolute; inset: 0; isolation: isolate; overflow: hidden; font-family: "Archivo", sans-serif; color: var(--ink); }
  .light { background: radial-gradient(circle farthest-corner at var(--lx, 30%) var(--ly, 35%), var(--paper-lit) 0, var(--paper) 55%, #e4dfe6 100%); }
  .dark { background: radial-gradient(circle farthest-corner at 65% 60%, var(--dark-lit) 0, var(--dark) 100%); color: var(--paper); }
  .world h1, .world p { margin: 0; font-weight: 800; letter-spacing: -0.035em; line-height: 1; white-space: pre; }
  .center { position: absolute; inset: 0; display: grid; place-content: center; }
  .typed { position: relative; display: inline-block; font-size: calc(var(--vh) * 0.1); }
  .caret { position: absolute; top: 6%; width: 0.07em; height: 88%; background: var(--accent); }
  .scr { font-size: calc(var(--vh) * 0.42); display: flex; }
  .scr span { display: inline-block; text-align: center; transform-origin: 50% 70%; }
  .pair { font-size: calc(var(--vh) * 0.3); display: flex; gap: 0.22em; align-items: baseline; }
  .pair span { display: inline-block; }
  .k { position: absolute; font-size: calc(var(--vh) * 0.3); display: inline-block; }
  .k1 { left: 9%; top: 18%; }
  .k2 { left: 58%; top: 50%; }
  .world .giant { position: absolute; inset: 0; margin: 0; text-transform: uppercase; font-weight: 900; }
  .L { position: absolute; left: var(--x); top: var(--y); font-size: calc(var(--vh) * var(--s)); line-height: 0.72; translate: -50% -50%; rotate: var(--r); }
  .L i { display: block; font-style: normal; }
  .L.dot { color: var(--accent); }
  .credit { font-weight: 500; }
  .drift { position: absolute; left: -10%; top: 40%; width: calc(var(--vh) * 1.1); height: calc(var(--vh) * 1.1); border-radius: 50%; background: radial-gradient(closest-side, #d6cfe2, transparent); z-index: -1; }
  .grain { position: absolute; inset: 0; opacity: 0.1; background-size: 256px 256px; mix-blend-mode: overlay; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div class="world light" data-world="say" style="--lx: 28%; --ly: 30%"><div class="center"><p class="typed" id="say">Say</p></div></div>
<div class="world light" data-world="less" style="--lx: 70%; --ly: 62%"><div class="center"><h1 class="scr" id="less">less.</h1></div></div>
<div class="world dark" data-world="mean"><div class="center"><h1 class="pair"><span class="m1">Mean</span><span class="m2">it.</span></h1></div></div>
<div class="world light" data-world="make" style="--lx: 20%; --ly: 70%"><h1 class="k k1">Make</h1><h1 class="k k2">it</h1></div>
<div class="world light" data-world="move" style="--lx: 50%; --ly: 45%"><h1 class="giant" id="giant">move.</h1></div>
<div class="world light" data-world="credit" style="--lx: 75%; --ly: 30%"><i class="drift" aria-hidden="true"></i><div class="center"><p class="typed credit" id="credit">Northwind Type Studio</p></div></div>
<div class="grain" aria-hidden="true"></div>
<audio data-synth="tick" data-at="0.1"></audio>
<audio data-synth="tap" data-at="1.3"></audio>
<audio data-synth="tap" data-at="2.6"></audio>
<audio data-synth="tap" data-at="3.7"></audio>
<audio data-synth="sub-thump" data-at="4.6"></audio>
<audio data-synth="tick" data-at="6.5"></audio>
<script type="module">
import { EASE, easeFn } from '../../core/motion/presets.js';
import { rng } from '../../core/motion/springs.js';
await document.fonts.load('800 1em "Archivo"');
await document.fonts.load('900 1em "Archivo"');
await document.fonts.load('500 1em "Archivo"');
const root = document.documentElement;
const beat = (n) => parseFloat(getComputedStyle(root).getPropertyValue('--beat-' + n));
const B = [1, 2, 3, 4, 5, 6].map(beat);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// hard cuts: each world shows from its beat until the next one covers it
const worlds = [...document.querySelectorAll('[data-world]')];
const cutTo = (el, visibility, at, fill) => el.animate([{ visibility: visibility === 'visible' ? 'hidden' : 'visible' }, { visibility }], { delay: at * 1000, duration: 1, fill });
worlds.forEach((w, i) => {
  if (i) cutTo(w, 'visible', B[i], 'both');
  if (i + 1 < worlds.length) cutTo(w, 'hidden', B[i + 1], 'forwards');
});

// a typed line: [start s, seconds per letter]; the caret stands after the last letter typed, then blinks
const typers = [[$('#say'), 0.1, 0.1], [$('#credit'), B[5] + 0.1, 0.03]].map(([el, at, step]) => {
  const text = el.textContent;
  el.textContent = '';
  const letters = [...text].map((ch) => { const s = document.createElement('span'); s.textContent = ch; el.appendChild(s); return s; });
  const caret = document.createElement('i');
  caret.className = 'caret';
  el.appendChild(caret);
  const rights = letters.map((s) => s.offsetLeft + s.offsetWidth);
  return (t) => {
    const n = clamp(Math.floor((t - at) / step) + 1, 0, letters.length);
    letters.forEach((s, i) => { s.style.opacity = i < n ? 1 : 0; });
    caret.style.left = (n ? rights[n - 1] : 0) + 'px';
    const typing = t >= at && n < letters.length;
    caret.style.opacity = typing || ((t - at) % 0.5) < 0.3 ? 1 : 0;
  };
});

// a decoded word: every glyph rolls through random ones in the accent colour, then lands on its own, left to right
const scr = $('#less');
const word = scr.textContent;
scr.textContent = '';
const SET = 'ilrtfj1!:;|';
const SETTLE = [1.46, 1.54, 1.62, 1.7, 1.8];   // when each glyph lands, in seconds
const spans = [...word].map((ch) => { const s = document.createElement('span'); s.textContent = ch; scr.appendChild(s); return s; });
spans.forEach((s) => { s.style.width = s.getBoundingClientRect().width + 'px'; });
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const decode = (t) => spans.forEach((s, i) => {
  const rolling = t < SETTLE[i];
  const f = Math.floor(t * 20);
  s.textContent = rolling ? SET[Math.floor(hash(i * 97 + f) * SET.length)] : word[i];
  s.style.color = rolling ? 'var(--accent)' : '';
  const k = clamp((t - SETTLE[i]) / 0.2, 0, 1);
  s.style.translate = rolling ? `0 ${((hash(i * 31 + f) - 0.5) * 0.12).toFixed(3)}em` : '0 0';
  s.style.scale = String(1 + 0.08 * (1 - k) ** 2);
});

vawe.onFrame((t) => { typers.forEach((u) => u(t)); decode(t); });

// "Mean it." slams in on the dark ground, one word then the other
const pop = (el, at, from, ease, { first = false, to = '0deg', until } = {}) => {
  const frames = first ? [{ ...from }, { scale: 1, rotate: to, translate: '0 0' }] : [{ ...from, opacity: 0 }, { opacity: 1, offset: 0.2 }, { scale: 1, rotate: to, translate: '0 0', opacity: 1 }];
  el.animate(frames, { delay: at * 1000, duration: 480, easing: ease, fill: 'both' });
  el.animate([{ scale: 1 }, { scale: 1.05 }], { delay: (at + 0.48) * 1000, duration: (until - at - 0.48) * 1000, easing: EASE.glide, fill: 'both' });
};
pop($('.m1'), B[2], { scale: 1.6, translate: '0 0' }, EASE.land, { first: true, until: B[3] });
pop($('.m2'), B[2] + 0.4, { scale: 1, rotate: '-9deg', translate: '0 -0.5em' }, EASE.land, { until: B[3] });

// "Make it" tilts in from two sides and keeps its tilt
pop($('.k1'), B[3], { scale: 1, rotate: '-10deg', translate: '-0.7em 0' }, EASE.land, { first: true, to: '-3deg', until: B[4] });
pop($('.k2'), B[3] + 0.35, { scale: 1, rotate: '8deg', translate: '0 0.9em' }, EASE.land, { to: '3deg', until: B[4] });

// the last word: one letter per glyph, [x, y, size in frame heights, rotation], each lands big and tilted, then drifts
const giant = $('#giant');
const gtext = giant.textContent;
giant.textContent = '';
const PLACE = [['23%', '30%', 0.5, -9], ['68%', '29%', 0.5, 7], ['22%', '76%', 0.52, 8], ['53%', '77%', 0.52, -6], ['82%', '78%', 0.5, 0]];
[...gtext].forEach((ch, i) => {
  const [x, y, s, r] = PLACE[i];
  const L = document.createElement('span');
  L.className = 'L' + (ch === '.' ? ' dot' : '');
  L.style.cssText = `--x:${x};--y:${y};--s:${s};--r:${r}deg`;
  const g = document.createElement('i');
  g.textContent = ch;
  L.appendChild(g);
  giant.appendChild(L);
  const dir = i % 2 ? 1 : -1;
  const at = B[4] * 1000 + i * 80;
  L.animate([{ scale: 1.1, rotate: `${r + dir * 14}deg`, opacity: 0 }, { opacity: 1, offset: 0.01 }, { scale: 1, rotate: `${r}deg`, opacity: 1 }], { delay: at, duration: 520, easing: ch === '.' ? EASE.pop : EASE.land, fill: 'both' });
  g.animate([{ rotate: '0deg', scale: 1 }, { rotate: `${-dir * 5}deg`, scale: 1.06 }], { delay: at + 520, duration: (B[5] - B[4]) * 1000 - 520, easing: EASE.glide, fill: 'both' });
});

// the credit holds while a soft shade crosses the ground
$('.drift').animate([{ translate: '0 0' }, { translate: 'calc(var(--vw) * 0.75) calc(var(--vh) * -0.3)' }], { delay: B[5] * 1000, duration: (8 - B[5]) * 1000, easing: EASE.glide, fill: 'both' });

// seeded grain at 1:1 pixels so the gradients do not band
const tile = document.createElement('canvas');
tile.width = tile.height = 256;
const g2 = tile.getContext('2d'), img = g2.createImageData(256, 256), rand = rng(5);
for (let i = 0; i < img.data.length; i += 4) { const v = rand() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
g2.putImageData(img, 0, 0);
$('.grain').style.backgroundImage = `url(${tile.toDataURL()})`;
</script>
</body>
</html>
