<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="duration" content="2">
<meta name="aspect" content="16:9">
<style>
*{margin:0}
html,body{height:100%;background:#f4f1ea;overflow:hidden}
.box{position:absolute;left:10%;top:40%;width:12vw;height:12vw;background:#17313b;border-radius:16px;animation:slide 1.5s var(--ease-power2-out) both}
.back{top:62%;background:#b4442c;animation-timing-function:var(--ease-back-out)}
@keyframes slide{from{translate:0 0}to{translate:60vw 0}}
</style></head><body>
<div class="box"></div><div class="box back"></div>
</body></html>
