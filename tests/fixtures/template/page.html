<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="duration" content="1">
<meta name="aspect" content="16:9">
<meta name="message" content="hello">
<title>template fixture</title>
<style>
  html, body { margin: 0; height: 100%; background: #101010; }
  .world { position: absolute; inset: 0; }
  .a { background: linear-gradient(90deg, #cc0000, #660000) 0 0 / 200% 100%; animation: gone 1ms 0.5s both, slide 0.5s linear both; }
  .b { background: #0000cc; animation: come 1ms 0.5s both; }
  .title { position: absolute; left: 10%; top: 40%; margin: 0; font: 400 120px sans-serif; color: #ffffff; animation: rise 0.3s linear both; }
  @keyframes gone { to { opacity: 0; } }
  @keyframes slide { to { background-position: 100% 0; } }
  @keyframes come { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; translate: 0 40px; } }
</style>
</head>
<body>
<section class="world a" data-world="first"></section>
<section class="world b" data-world="second"></section>
<h1 class="title">Hello</h1>
<audio data-synth="tap" data-at="0.2"></audio>
</body>
</html>
